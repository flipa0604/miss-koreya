# /etc/nginx/sites-available/misskoreya
# After editing: sudo cp deploy/nginx.conf /etc/nginx/sites-available/misskoreya
#                sudo nginx -t && sudo systemctl reload nginx

# HTTP — redirect all traffic to HTTPS, except ACME challenge for cert renewal
server {
    listen 80;
    server_name misskoreya.online www.misskoreya.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main site
server {
    listen 443 ssl http2;
    server_name misskoreya.online www.misskoreya.online;

    ssl_certificate     /etc/letsencrypt/live/misskoreya.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/misskoreya.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MissKoreyaSSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
