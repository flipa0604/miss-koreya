# /etc/nginx/sites-available/misskoreya
# After editing: sudo ln -s /etc/nginx/sites-available/misskoreya /etc/nginx/sites-enabled/
#                sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name misskoreya.online www.misskoreya.online;

    # ACME challenge for Let's Encrypt (webroot mode):
    #   sudo mkdir -p /var/www/certbot
    #   sudo certbot certonly --webroot -w /var/www/certbot -d misskoreya.online -d www.misskoreya.online
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
