# /etc/nginx/sites-available/misskoreya
# After editing: sudo cp deploy/nginx.conf /etc/nginx/sites-available/misskoreya
#                sudo nginx -t && sudo systemctl reload nginx
#
# Hosting provider terminates HTTPS in front of us (browser -> provider:443 ->
# server:80). So port 80 must serve content directly, not redirect to HTTPS,
# or we end up in an infinite redirect loop. X-Forwarded-Proto=https tells
# FastAPI the original scheme. Port 443 stays available for direct connections.

# HTTP — serve content (provider proxies HTTPS requests to us as HTTP)
server {
    listen 80;
    server_name misskoreya.online www.misskoreya.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }
}

# HTTPS — direct connections (used when reaching the server bypassing the provider proxy)
server {
    listen 443 ssl http2;
    server_name misskoreya.online www.misskoreya.online;

    ssl_certificate     /etc/letsencrypt/live/misskoreya.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/misskoreya.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MissKoreyaSSL:10m;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }
}
