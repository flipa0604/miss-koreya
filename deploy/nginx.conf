# /etc/nginx/sites-available/misskoreya
# After editing: sudo ln -s /etc/nginx/sites-available/misskoreya /etc/nginx/sites-enabled/
#                sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name misskoreya.online www.misskoreya.online;

    # HTTPS via certbot (Telegram Mini App talab qiladi):
    #   sudo apt install -y certbot python3-certbot-nginx
    #   sudo certbot --nginx -d misskoreya.online -d www.misskoreya.online

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
